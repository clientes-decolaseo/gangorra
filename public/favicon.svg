<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Gangorra Audiodescrição">
  <!--
    Ícone da marca Gangorra: pilar + barras da gangorra em movimento.
    Cores amostradas da logo oficial.
  -->
  <defs>
    <!-- Barra com ganchos nas pontas (esquerda sobe, direita desce) -->
    <g id="bar-lr">
      <path
        d="M8 0 H52 M76 0 H120 M8 0 V-12 M120 0 V12"
        fill="none"
        stroke="currentColor"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </defs>

  <!-- Barras claras em ângulo (movimento) -->
  <g color="#A5D6F7" transform="translate(64 64) rotate(-18) translate(-64 -64)">
    <use href="#bar-lr" x="0" y="64" />
  </g>
  <g color="#A5D6F7" transform="translate(64 64) rotate(18) translate(-64 -64)">
    <use href="#bar-lr" x="0" y="64" />
  </g>

  <!-- Barra principal -->
  <g color="#1C82C7">
    <use href="#bar-lr" x="0" y="64" />
  </g>

  <!-- Pilar -->
  <rect x="56" y="24" width="16" height="80" rx="8" fill="#0D5B93" />
  <rect x="50" y="96" width="28" height="8" rx="3" fill="#0D5B93" />

  <!-- Pivô -->
  <circle cx="64" cy="36" r="7" fill="#FFFFFF" />
</svg>
